services: web
  type: web
  name: creator-sync-backend
  env: python
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: SECRET_KEY
      generateValue: true
    - key: FERNET_KEY
      sync: false
    - key: OPENAI_API_KEY
      sync: false
    - key: DATABASE_URL
      value: sqlite:////data/creator_sync.db
    - key: FRONTEND_URL
      sync: false
    - key: ENV
      value: production
  disk:
    name: creator-sync-data
    mountPath: /data
    sizeGB: 1
